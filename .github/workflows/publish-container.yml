name: Verify, publish and deploy collector

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: collector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.3.4
          poetry install --with dev --no-interaction --no-ansi
      - name: Run isolated tests
        run: poetry run pytest -q -m "not live and not selenium"
      - name: Verify container build
        run: docker build -t setup-collector:ci .

  publish:
    needs: verify
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish collector image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/relix96/f1-setup-collector:${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
            ghcr.io/relix96/f1-setup-collector:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/relix96/F1-Setup-Collector
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, poseidon]
    environment: production
    steps:
      - name: Trigger Portainer application stack webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_API_WEBHOOK_URL }}
          PORTAINER_BASE_URL: ${{ vars.PORTAINER_BASE_URL || 'http://127.0.0.1:9000' }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          webhook_without_scheme="${PORTAINER_WEBHOOK_URL#*://}"
          webhook_path="/${webhook_without_scheme#*/}"
          curl --fail --show-error --silent --request POST \
            "${PORTAINER_BASE_URL%/}${webhook_path}"
      - name: Verify application health
        env:
          HEALTHCHECK_URL: ${{ vars.API_HEALTHCHECK_URL || 'http://127.0.0.1:8000/api/v1/health/live' }}
        run: |
          sleep 10
          for attempt in {1..36}; do
            if curl --fail --show-error --silent "$HEALTHCHECK_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Application did not become healthy after deployment" >&2
          exit 1

  deploy-staging:
    needs: publish
    if: >-
      github.ref == 'refs/heads/develop' &&
      vars.AUTO_DEPLOY_STAGING_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, poseidon]
    environment: staging
    steps:
      - name: Trigger Portainer staging application stack webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_API_STAGING_WEBHOOK_URL }}
          PORTAINER_BASE_URL: ${{ vars.PORTAINER_BASE_URL || 'http://127.0.0.1:9000' }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          webhook_without_scheme="${PORTAINER_WEBHOOK_URL#*://}"
          webhook_path="/${webhook_without_scheme#*/}"
          curl --fail --show-error --silent --request POST \
            "${PORTAINER_BASE_URL%/}${webhook_path}"
      - name: Verify staging application health
        env:
          HEALTHCHECK_URL: ${{ vars.API_STAGING_HEALTHCHECK_URL || 'http://127.0.0.1:8001/api/v1/health/live' }}
        run: |
          sleep 10
          for attempt in {1..36}; do
            if curl --fail --show-error --silent "$HEALTHCHECK_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging application did not become healthy after deployment" >&2
          exit 1
